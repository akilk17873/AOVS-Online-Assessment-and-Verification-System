<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AOVS — Online Assessment &amp; Verification System</title>
    <meta name="description" content="Next-Generation Online Assessment &amp; Intelligent Verification Platform. Secure, AI-proctored exams and tamper-proof academic credentials." />
    <script type="module" crossorigin src="./assets/index-mxWvsbTw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DFD7ok7k.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Active Student Session Floating Widget -->
    <div id="activeStudentSessionWidget" style="display: none; position: fixed; bottom: 24px; left: 24px; z-index: 9999; background: rgba(24, 24, 27, 0.95); border: 1px solid rgba(237, 255, 102, 0.4); backdrop-filter: blur(12px); border-radius: 9999px; padding: 8px 18px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); font-family: system-ui, -apple-system, sans-serif; align-items: center; gap: 12px;">
      <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
      <span style="color: #dfdff2; font-size: 13px; font-weight: 500;">
        Logged in as <strong id="sessionStudentName" style="color: #edff66;">Student</strong>
      </span>
      <a href="/Exam/index.html" style="background: #edff66; color: #000; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 9999px; text-decoration: none; transition: opacity 0.2s;">
        Resume Exam &rarr;
      </a>
    </div>

    <script>
      (function() {
        try {
          const stored = sessionStorage.getItem('aovs_student');
          if (stored) {
            const student = JSON.parse(stored);
            if (student && student.studentId) {
              const widget = document.getElementById('activeStudentSessionWidget');
              const nameEl = document.getElementById('sessionStudentName');
              if (widget && nameEl) {
                nameEl.textContent = student.name || student.studentId;
                widget.style.display = 'inline-flex';
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </body>
</html>
